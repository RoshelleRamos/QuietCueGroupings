services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: quietcue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
      POSTGRES_DB: quietcue
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - quietcue_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quietcue -d quietcue"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  quietcue_data:
